name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HarvestNet.sln

      - name: Build
        run: dotnet build HarvestNet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/HarvestNet.Tests/HarvestNet.Tests.csproj --no-restore --configuration Release

      - name: Pack HarvestNet.Core
        run: dotnet pack src/HarvestNet.Core/HarvestNet.Core.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack HarvestNet.Browser
        run: dotnet pack src/HarvestNet.Browser/HarvestNet.Browser.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack HarvestNet.Cli
        run: dotnet pack src/HarvestNet.Cli/HarvestNet.Cli.csproj --configuration Release --no-build --output ./artifacts

      - name: Log in to NuGet.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
